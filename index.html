<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Second Brain — Kontenlaris Studio</title>
<style>
:root{--bg:#0A1931;--panel:#10234a;--card:#132a56;--text:#e8edf7;--muted:#93a5c9;--acc:#FF7A00;--border:#24407c}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
#lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:28px;max-width:380px;width:100%;text-align:center}
.box h1{font-size:20px;margin:0 0 6px}.box p{color:var(--muted);font-size:14px;margin:0 0 18px}
input[type=password],input[type=search]{width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:15px}
button{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:12px 18px;font-size:15px;font-weight:600;width:100%;margin-top:12px;cursor:pointer}
.err{color:#ff7b7b;font-size:13px;min-height:18px;margin-top:10px}
label.rem{display:flex;gap:8px;align-items:center;justify-content:center;color:var(--muted);font-size:13px;margin-top:12px}
label.rem input{width:auto}
#app{display:none;height:100vh}
header{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--panel)}
header b{white-space:nowrap}header input{flex:1}header button{width:auto;margin:0;padding:9px 14px}
main{display:flex;height:calc(100vh - 57px)}
nav{width:300px;overflow:auto;border-right:1px solid var(--border);padding:10px;background:var(--panel)}
nav .grp{color:var(--acc);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin:14px 6px 6px}
nav a{display:block;color:var(--text);text-decoration:none;padding:7px 10px;border-radius:8px;font-size:14px}
nav a:hover,nav a.act{background:var(--card)}
article{flex:1;overflow:auto;padding:22px;max-width:900px;line-height:1.65;font-size:15px}
article a{color:var(--acc)}article code{background:var(--card);padding:1px 5px;border-radius:5px}
article pre{background:var(--card);padding:12px;border-radius:10px;overflow:auto}
article table{border-collapse:collapse}article td,article th{border:1px solid var(--border);padding:6px 10px}
#graphwrap{display:none;position:relative;flex:1;background:radial-gradient(circle at 50% 40%,#12295c,#0A1931 70%)}
#cv{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.gbtns{position:absolute;right:12px;bottom:12px;display:flex;gap:8px}
.gbtns button{width:44px;height:44px;margin:0;border-radius:50%;font-size:19px;padding:0}
.ghint{position:absolute;left:12px;bottom:12px;color:var(--muted);font-size:12px;background:rgba(10,25,49,.7);padding:6px 10px;border-radius:8px}
header .tog{width:auto;margin:0;padding:9px 12px;background:var(--card)}
header .tog.on{background:var(--acc)}
@media(max-width:700px){nav{display:none}nav.open{display:block;position:absolute;z-index:5;height:calc(100vh - 57px)}
header{flex-wrap:wrap}header b{font-size:15px}header input{order:5;flex:1 1 100%}header button{padding:8px 10px;font-size:13px}main{height:calc(100vh - 98px)}#graphwrap{height:calc(100vh - 98px)!important}}
</style></head><body>
<div id="lock"><div class="box">
<h1>🔒 Second Brain</h1><p>Vault privat Kontenlaris Studio — 33 catatan terenkripsi. Masukkan password untuk membuka.</p>
<input type="password" id="pw" placeholder="Password" autocomplete="current-password">
<button id="go">Buka Vault</button>
<label class="rem"><input type="checkbox" id="rem"> Ingat di perangkat ini</label>
<div class="err" id="err"></div></div></div>
<div id="app"><header><b>🧠 Second Brain</b><input type="search" id="q" placeholder="Cari catatan…"><button class="tog on" id="tNote">📄 Catatan</button><button class="tog" id="tGraph">🕸️ Graf</button><button id="menu">☰</button><button id="out">Kunci</button></header>
<main id="mainNote"><nav id="nav"></nav><article id="view"></article></main>
<div id="graphwrap" style="height:calc(100vh - 57px)"><canvas id="cv"></canvas>
<div class="ghint">Seret titik = pindah node • Klik titik = buka catatan • Seret latar / roda / cubit = geser & zoom</div>
<div class="gbtns"><button id="gz">+</button><button id="gzo">−</button><button id="gr">⟳</button></div></div></div>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(SALT),iterations:600000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},true,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(NONCE)},key,b64(CT));
  return {key:await crypto.subtle.exportKey("raw",key),data:JSON.parse(new TextDecoder().decode(pt))};
}
async function unlockWithKey(raw){
  const key=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(NONCE)},key,b64(CT));
  return JSON.parse(new TextDecoder().decode(pt));
}
let NOTES=[],GRAPH=null;
function show(data){
  NOTES=data.notes;GRAPH=data.graph;
  document.getElementById("lock").style.display="none";
  document.getElementById("app").style.display="block";
  renderNav("");openNote(NOTES[0].path);
}
function renderNav(f){
  const nav=document.getElementById("nav");nav.innerHTML="";let grp="";
  for(const n of NOTES){
    if(n.hub)continue;
    if(f && !(n.title+" "+n.path).toLowerCase().includes(f))continue;
    const g=n.path.includes("/")?n.path.split("/")[0]:"Catatan";
    if(g!==grp){grp=g;const d=document.createElement("div");d.className="grp";d.textContent=g;nav.appendChild(d);}
    const a=document.createElement("a");a.href="#";a.textContent=n.title;a.dataset.path=n.path;
    a.onclick=e=>{e.preventDefault();openNote(n.path);nav.classList.remove("open")};nav.appendChild(a);
  }
}
function openNote(path){
  const n=NOTES.find(x=>x.path===path);if(!n)return;
  setView(false);
  const v=document.getElementById("view");v.innerHTML=n.html;v.scrollTop=0;
  document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("act",a.dataset.path===path));
  v.querySelectorAll("a[data-note]").forEach(a=>a.onclick=e=>{e.preventDefault();openNote(a.dataset.note)});
}
async function tryGo(){
  const pw=document.getElementById("pw").value,err=document.getElementById("err");err.textContent="";
  try{const r=await unlock(pw);
    if(document.getElementById("rem").checked)localStorage.setItem("sbw_key",btoa(String.fromCharCode(...new Uint8Array(r.key))));
    show(r.data);
  }catch(e){err.textContent="Password salah, coba lagi.";}
}
document.getElementById("go").onclick=tryGo;
document.getElementById("pw").addEventListener("keydown",e=>{if(e.key==="Enter")tryGo()});
document.getElementById("q").addEventListener("input",e=>renderNav(e.target.value.toLowerCase()));
document.getElementById("menu").onclick=()=>document.getElementById("nav").classList.toggle("open");
document.getElementById("out").onclick=()=>{localStorage.removeItem("sbw_key");location.reload()};
/* ===== Graph view: force-directed brain network ===== */
const COLORS={"00-Beranda.md":"#FF7A00","Memori":"#4da3ff","Orang":"#ffd24d","Grup":"#ff7bd5","Proyek":"#5ee08a","Lainnya":"#b9c6e8"};
function nodeColor(n){if(n.path==="00-Beranda.md")return COLORS["00-Beranda.md"];const f=n.path.includes("/")?n.path.split("/")[0]:"Lainnya";return COLORS[f]||COLORS["Lainnya"]}
let G=null,view={x:0,y:0,k:1},drag=null,pan=null,moved=false,hover=null,pinch=null;
function setView(graph){
  document.getElementById("mainNote").style.display=graph?"none":"flex";
  document.getElementById("graphwrap").style.display=graph?"block":"none";
  document.getElementById("tNote").classList.toggle("on",!graph);
  document.getElementById("tGraph").classList.toggle("on",graph);
  if(graph)initGraph();
}
document.getElementById("tNote").onclick=()=>setView(false);
document.getElementById("tGraph").onclick=()=>setView(true);
function initGraph(){
  const cv=document.getElementById("cv"),wrap=document.getElementById("graphwrap");
  cv.width=wrap.clientWidth*devicePixelRatio;cv.height=wrap.clientHeight*devicePixelRatio;
  if(!G){
    const idx={};NOTES.forEach((n,i)=>idx[n.path]=i);
    const deg=NOTES.map(()=>0);const E=(GRAPH?GRAPH.edges:[]).map(e=>[idx[e[0]],idx[e[1]]]).filter(e=>e[0]!=null&&e[1]!=null);
    E.forEach(e=>{deg[e[0]]++;deg[e[1]]++});
    const N=NOTES.map((n,i)=>{const a=i/NOTES.length*Math.PI*2,r=60+ (i%5)*46;return{n,x:Math.cos(a)*r,y:Math.sin(a)*r,vx:0,vy:0,deg:deg[i],rad:6+Math.min(11,deg[i]*1.15)}});
    G={N,E};view={x:cv.width/2,y:cv.height/2,k:devicePixelRatio};
    requestAnimationFrame(tick);
  }
}
function tick(){
  if(document.getElementById("graphwrap").style.display==="none"){requestAnimationFrame(tick);return}
  const cv=document.getElementById("cv"),ctx=cv.getContext("2d"),{N,E}=G;
  for(let s=0;s<2;s++){
    for(let i=0;i<N.length;i++)for(let j=i+1;j<N.length;j++){
      let dx=N[i].x-N[j].x,dy=N[i].y-N[j].y,d2=dx*dx+dy*dy+0.01,d=Math.sqrt(d2),f=1500/d2;
      dx/=d;dy/=d;N[i].vx+=dx*f;N[i].vy+=dy*f;N[j].vx-=dx*f;N[j].vy-=dy*f;
    }
    for(const[a,b]of E){let dx=N[b].x-N[a].x,dy=N[b].y-N[a].y,d=Math.sqrt(dx*dx+dy*dy)+0.01,f=(d-95)*0.03;dx/=d;dy/=d;N[a].vx+=dx*f;N[a].vy+=dy*f;N[b].vx-=dx*f;N[b].vy-=dy*f}
    for(const n of N){n.vx+=-n.x*0.0016;n.vy+=-n.y*0.0016;if(drag&&drag.n===n)continue;n.vx*=0.86;n.vy*=0.86;n.x+=n.vx;n.y+=n.vy}
  }
  ctx.clearRect(0,0,cv.width,cv.height);ctx.save();ctx.translate(view.x,view.y);ctx.scale(view.k,view.k);
  ctx.lineWidth=1.4;
  for(const[a,b]of E){const hot=hover&&(a===hover||b===hover);ctx.strokeStyle=hot?"rgba(255,122,0,.95)":"rgba(160,185,230,.55)";ctx.beginPath();ctx.moveTo(N[a].x,N[a].y);ctx.lineTo(N[b].x,N[b].y);ctx.stroke()}
  for(const n of N){
    ctx.beginPath();ctx.arc(n.x,n.y,n.rad,0,7);ctx.fillStyle=nodeColor(n.n);ctx.fill();
    if(hover===N.indexOf(n)){ctx.lineWidth=2.5/view.k;ctx.strokeStyle="#fff";ctx.stroke()}
    ctx.fillStyle="rgba(232,237,247,.92)";ctx.font=`${11/view.k*1.6}px system-ui`;ctx.textAlign="center";
    const t=n.n.title.length>26?n.n.title.slice(0,25)+"…":n.n.title;
    ctx.fillText(t,n.x,n.y+n.rad+14);
  }
  ctx.restore();requestAnimationFrame(tick);
}
function toWorld(e){const r=document.getElementById("cv").getBoundingClientRect();const px=(e.clientX-r.left)*devicePixelRatio,py=(e.clientY-r.top)*devicePixelRatio;return{x:(px-view.x)/view.k,y:(py-view.y)/view.k,px,py}}
function pick(w){let best=null,bd=1e9;G.N.forEach((n,i)=>{const d=(n.x-w.x)**2+(n.y-w.y)**2;if(d<bd){bd=d;best=i}});return bd< (G.N[best].rad+9)**2?best:null}
const cvEl=document.getElementById("cv");
cvEl.addEventListener("pointerdown",e=>{cvEl.setPointerCapture(e.pointerId);const w=toWorld(e);const i=pick(w);moved=false;
  if(i!=null){drag={n:G.N[i],i,dx:G.N[i].x-w.x,dy:G.N[i].y-w.y,wx:w.x,wy:w.y}}else{pan={sx:e.clientX,sy:e.clientY,vx:view.x,vy:view.y}}});
cvEl.addEventListener("pointermove",e=>{const w=toWorld(e);
  if(drag){drag.n.x=w.x+drag.dx;drag.n.y=w.y+drag.dy;drag.n.vx=0;drag.n.vy=0;if(Math.hypot(w.x-drag.wx,w.y-drag.wy)>4)moved=true}
  else if(pan){view.x=pan.vx+(e.clientX-pan.sx)*devicePixelRatio;view.y=pan.vy+(e.clientY-pan.sy)*devicePixelRatio;if(Math.abs(e.clientX-pan.sx)+Math.abs(e.clientY-pan.sy)>3)moved=true}
  else hover=pick(w);});
cvEl.addEventListener("pointerup",e=>{if(drag&&!moved){} if(drag&&moved===false){openNote(G.N[drag.i].n.path)} drag=null;pan=null;});
cvEl.addEventListener("wheel",e=>{e.preventDefault();const f=e.deltaY<0?1.12:0.89;view.k=Math.min(3.2,Math.max(0.25,view.k*f))},{passive:false});
cvEl.addEventListener("touchstart",e=>{if(e.touches.length===2){const[a,b]=e.touches;pinch={d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),k:view.k}}},{passive:true});
cvEl.addEventListener("touchmove",e=>{if(pinch&&e.touches.length===2){const[a,b]=e.touches;const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);view.k=Math.min(3.2,Math.max(0.25,pinch.k*d/pinch.d))}},{passive:true});
cvEl.addEventListener("touchend",()=>pinch=null);
document.getElementById("gz").onclick=()=>view.k=Math.min(3.2,view.k*1.25);
document.getElementById("gzo").onclick=()=>view.k=Math.max(0.25,view.k*0.8);
document.getElementById("gr").onclick=()=>{G=null;initGraph()};

(async()=>{const s=localStorage.getItem("sbw_key");if(s){try{const raw=Uint8Array.from(atob(s),c=>c.charCodeAt(0));show(await unlockWithKey(raw));}catch(e){localStorage.removeItem("sbw_key")}}})();
</script></body></html>
