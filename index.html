<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Second Brain — Kontenlaris Studio</title>
<style>
:root{--bg:#070f22;--panel:rgba(16,35,74,.72);--card:rgba(30,58,115,.55);--text:#eef2fb;--muted:#9db0d6;--acc:#FF7A00;--acc2:#ffb347;--border:rgba(90,130,220,.28);--glass:blur(14px) saturate(1.3)}
*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",sans-serif;background:radial-gradient(1100px 700px at 85% -10%,#1b3a75 0%,transparent 55%),radial-gradient(900px 650px at -10% 110%,#3a1c56 0%,transparent 50%),var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
#lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(600px 400px at 50% 30%,rgba(255,122,0,.13),transparent 65%)}
.box{background:var(--panel);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);border:1px solid var(--border);border-radius:24px;padding:34px 30px;max-width:390px;width:100%;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.08)}
.box .ring{width:76px;height:76px;margin:0 auto 16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:34px;background:radial-gradient(circle at 32% 28%,#ffb347,#FF7A00 58%,#c24e00);box-shadow:0 0 0 6px rgba(255,122,0,.15),0 0 42px rgba(255,122,0,.45);animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 6px rgba(255,122,0,.15),0 0 42px rgba(255,122,0,.45)}50%{box-shadow:0 0 0 11px rgba(255,122,0,.07),0 0 64px rgba(255,122,0,.65)}}
.box h1{font-size:22px;margin:0 0 6px;letter-spacing:.01em}.box p{color:var(--muted);font-size:14px;margin:0 0 20px;line-height:1.55}
input[type=password],input[type=search]{width:100%;padding:12px 16px;border-radius:999px;border:1px solid var(--border);background:rgba(7,15,34,.75);color:var(--text);font-size:15px;outline:none;transition:border-color .2s,box-shadow .2s}
input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(255,122,0,.22)}
button{background:linear-gradient(135deg,var(--acc2),var(--acc) 55%,#e05f00);color:#fff;border:0;border-radius:999px;padding:12px 18px;font-size:15px;font-weight:700;width:100%;margin-top:12px;cursor:pointer;box-shadow:0 8px 22px rgba(255,122,0,.35);transition:transform .15s,box-shadow .15s}
button:active{transform:scale(.97)}
.err{color:#ff8f8f;font-size:13px;min-height:18px;margin-top:10px}
label.rem{display:flex;gap:8px;align-items:center;justify-content:center;color:var(--muted);font-size:13px;margin-top:14px}
label.rem input{width:auto;accent-color:var(--acc)}
#app{display:none;height:100vh}
header{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--panel);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass)}
header b{white-space:nowrap;font-size:17px}header input{flex:1}header button{width:auto;margin:0;padding:9px 15px;box-shadow:none}
main{display:flex;height:calc(100vh - 57px)}
nav{width:300px;overflow:auto;border-right:1px solid var(--border);padding:12px;background:var(--panel);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass)}
nav .grp{color:var(--acc2);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;margin:16px 8px 7px}
nav a{display:block;color:var(--text);text-decoration:none;padding:8px 12px;border-radius:10px;font-size:14px;transition:background .15s}
nav a:hover{background:var(--card)}nav a.act{background:linear-gradient(135deg,rgba(255,122,0,.32),rgba(255,122,0,.14));border:1px solid rgba(255,122,0,.4)}
article{flex:1;overflow:auto;padding:28px 30px;max-width:920px;line-height:1.75;font-size:15.5px}
article h1{font-size:26px;line-height:1.3;border-bottom:2px solid rgba(255,122,0,.45);padding-bottom:10px}
article h2{font-size:20px;margin-top:28px;color:#ffd9ad}article h3{color:#cfe0ff}
article a{color:var(--acc2)}article code{background:var(--card);padding:2px 6px;border-radius:6px;font-size:.92em}
article pre{background:rgba(7,15,34,.8);border:1px solid var(--border);padding:14px;border-radius:14px;overflow:auto}
article table{border-collapse:collapse}article td,article th{border:1px solid var(--border);padding:7px 11px}
article blockquote{border-left:3px solid var(--acc);margin:14px 0;padding:4px 14px;color:var(--muted);background:rgba(255,122,0,.06);border-radius:0 10px 10px 0}
#graphwrap{display:none;position:relative;flex:1;background:radial-gradient(900px 600px at 50% 38%,#17356e 0%,#0b1c3e 52%,#060d20 100%)}
#cv{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.gbtns{position:absolute;right:12px;bottom:12px;display:flex;gap:8px}
.gbtns button{width:44px;height:44px;margin:0;border-radius:50%;font-size:19px;padding:0}
.ghint{position:absolute;left:12px;bottom:12px;color:var(--muted);font-size:12px;background:rgba(10,25,49,.7);padding:6px 10px;border-radius:8px}
header .tog{width:auto;margin:0;padding:9px 12px;background:var(--card);box-shadow:none}
header .tog.on{background:linear-gradient(135deg,var(--acc2),var(--acc) 60%,#e05f00);box-shadow:0 6px 18px rgba(255,122,0,.35)}
@media(max-width:700px){nav{display:none}nav.open{display:block;position:absolute;z-index:5;height:calc(100vh - 57px)}
header{flex-wrap:wrap}header b{font-size:15px}header input{order:5;flex:1 1 100%}header button{padding:8px 10px;font-size:13px}main{height:calc(100vh - 98px)}#graphwrap{height:calc(100vh - 98px)!important}}
</style></head><body>
<div id="lock"><div class="box">
<div class="ring">🧠</div>
<h1>Second Brain</h1><p>Vault privat Kontenlaris Studio — 29 catatan terenkripsi AES-256. Masukkan password untuk membuka.</p>
<input type="password" id="pw" placeholder="Password" autocomplete="current-password">
<button id="go">Buka Vault</button>
<label class="rem"><input type="checkbox" id="rem"> Ingat di perangkat ini</label>
<div class="err" id="err"></div></div></div>
<div id="app"><header><b>🧠 Second Brain</b><input type="search" id="q" placeholder="Cari catatan…"><button class="tog on" id="tNote">📄 Catatan</button><button class="tog" id="tGraph">🕸️ Graf</button><button id="menu">☰</button><button id="out">Kunci</button></header>
<main id="mainNote"><nav id="nav"></nav><article id="view"></article></main>
<div id="graphwrap" style="height:calc(100vh - 57px)"><canvas id="cv"></canvas>
<div class="ghint">Seret titik = pindah node • Klik titik = buka catatan • Seret latar / roda / cubit = geser & zoom</div>
<div class="gbtns"><button id="gz">+</button><button id="gzo">−</button><button id="gr">⟳</button></div></div></div>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(SALT),iterations:600000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},true,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(NONCE)},key,b64(CT));
  return {key:await crypto.subtle.exportKey("raw",key),data:JSON.parse(new TextDecoder().decode(pt))};
}
async function unlockWithKey(raw){
  const key=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(NONCE)},key,b64(CT));
  return JSON.parse(new TextDecoder().decode(pt));
}
let NOTES=[],GRAPH=null;
function show(data){
  NOTES=data.notes;GRAPH=data.graph;
  document.getElementById("lock").style.display="none";
  document.getElementById("app").style.display="block";
  renderNav("");openNote(NOTES[0].path);
}
function renderNav(f){
  const nav=document.getElementById("nav");nav.innerHTML="";let grp="";
  for(const n of NOTES){
    if(n.hub)continue;
    if(f && !(n.title+" "+n.path).toLowerCase().includes(f))continue;
    const g=n.path.includes("/")?n.path.split("/")[0]:"Catatan";
    if(g!==grp){grp=g;const d=document.createElement("div");d.className="grp";d.textContent=g;nav.appendChild(d);}
    const a=document.createElement("a");a.href="#";a.textContent=n.title;a.dataset.path=n.path;
    a.onclick=e=>{e.preventDefault();openNote(n.path);nav.classList.remove("open")};nav.appendChild(a);
  }
}
function openNote(path){
  const n=NOTES.find(x=>x.path===path);if(!n)return;
  setView(false);
  const v=document.getElementById("view");v.innerHTML=n.html;v.scrollTop=0;
  document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("act",a.dataset.path===path));
  v.querySelectorAll("a[data-note]").forEach(a=>a.onclick=e=>{e.preventDefault();openNote(a.dataset.note)});
}
async function tryGo(){
  const pw=document.getElementById("pw").value,err=document.getElementById("err");err.textContent="";
  try{const r=await unlock(pw);
    if(document.getElementById("rem").checked)localStorage.setItem("sbw_key",btoa(String.fromCharCode(...new Uint8Array(r.key))));
    show(r.data);
  }catch(e){err.textContent="Password salah, coba lagi.";}
}
document.getElementById("go").onclick=tryGo;
document.getElementById("pw").addEventListener("keydown",e=>{if(e.key==="Enter")tryGo()});
document.getElementById("q").addEventListener("input",e=>renderNav(e.target.value.toLowerCase()));
document.getElementById("menu").onclick=()=>document.getElementById("nav").classList.toggle("open");
document.getElementById("out").onclick=()=>{localStorage.removeItem("sbw_key");location.reload()};

if(!CanvasRenderingContext2D.prototype.roundRect){CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){r=Math.min(r,w/2,h/2);this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();return this}}
const COLORS={"00-Beranda.md":"#FF7A00","Memori":"#4da3ff","Orang":"#ffd24d","Grup":"#ff7bd5","Proyek":"#5ee08a","Lainnya":"#b9c6e8"};
function nodeColor(n){if(n.path==="00-Beranda.md")return COLORS["00-Beranda.md"];const f=n.path.includes("/")?n.path.split("/")[0]:"Lainnya";return COLORS[f]||COLORS["Lainnya"]}
let G=null,view={x:0,y:0,k:1},drag=null,pan=null,moved=false,hover=null,pinch=null;
function setView(graph){
  document.getElementById("mainNote").style.display=graph?"none":"flex";
  document.getElementById("graphwrap").style.display=graph?"block":"none";
  document.getElementById("tNote").classList.toggle("on",!graph);
  document.getElementById("tGraph").classList.toggle("on",graph);
  if(graph)initGraph();
}
document.getElementById("tNote").onclick=()=>setView(false);
document.getElementById("tGraph").onclick=()=>setView(true);
function initGraph(){
  const cv=document.getElementById("cv"),wrap=document.getElementById("graphwrap");
  cv.width=wrap.clientWidth*devicePixelRatio;cv.height=wrap.clientHeight*devicePixelRatio;
  if(!G){
    const idx={};NOTES.forEach((n,i)=>idx[n.path]=i);
    const deg=NOTES.map(()=>0);const E=(GRAPH?GRAPH.edges:[]).map(e=>[idx[e[0]],idx[e[1]]]).filter(e=>e[0]!=null&&e[1]!=null);
    E.forEach(e=>{deg[e[0]]++;deg[e[1]]++});
    const N=NOTES.map((n,i)=>{const a=i/NOTES.length*Math.PI*2,r=60+ (i%5)*46;return{n,x:Math.cos(a)*r,y:Math.sin(a)*r,vx:0,vy:0,deg:deg[i],rad:6+Math.min(11,deg[i]*1.15)}});
    G={N,E};view={x:cv.width/2,y:cv.height/2,k:devicePixelRatio};
    requestAnimationFrame(tick);
  }
}
function tick(){
  const cv=document.getElementById("cv"),ctx=cv.getContext("2d");
  if(document.getElementById("graphwrap").style.display==="none"){requestAnimationFrame(tick);return}
  const {N,E}=G,t=performance.now()/1000;
  for(let s=0;s<2;s++){
    for(let i=0;i<N.length;i++)for(let j=i+1;j<N.length;j++){
      let dx=N[i].x-N[j].x,dy=N[i].y-N[j].y,d2=dx*dx+dy*dy+0.01,d=Math.sqrt(d2),f=1500/d2;
      dx/=d;dy/=d;N[i].vx+=dx*f;N[i].vy+=dy*f;N[j].vx-=dx*f;N[j].vy-=dy*f;
    }
    for(const[a,b]of E){let dx=N[b].x-N[a].x,dy=N[b].y-N[a].y,d=Math.sqrt(dx*dx+dy*dy)+0.01,f=(d-95)*0.03;dx/=d;dy/=d;N[a].vx+=dx*f;N[a].vy+=dy*f;N[b].vx-=dx*f;N[b].vy-=dy*f}
    for(const n of N){n.vx+=-n.x*0.0016;n.vy+=-n.y*0.0016;if(drag&&drag.n===n)continue;n.vx*=0.86;n.vy*=0.86;n.x+=n.vx;n.y+=n.vy}
  }
  /* starfield */
  ctx.clearRect(0,0,cv.width,cv.height);
  if(!tick.stars){tick.stars=[];let seed=42;const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};for(let i=0;i<130;i++)tick.stars.push({x:rnd(),y:rnd(),r:rnd()*1.5+0.4,p:rnd()*6.28})}
  for(const st of tick.stars){const a=0.25+0.35*(0.5+0.5*Math.sin(t*0.9+st.p));ctx.beginPath();ctx.arc(st.x*cv.width,st.y*cv.height,st.r*devicePixelRatio,0,7);ctx.fillStyle=`rgba(190,210,255,${a})`;ctx.fill()}
  ctx.save();ctx.translate(view.x,view.y);ctx.scale(view.k,view.k);
  const nb=hover==null?null:new Set([hover,...E.flatMap(e=>e[0]===hover?[e[1]]:e[1]===hover?[e[0]]:[])]);
  /* curved threads with travelling light pulses */
  ctx.lineWidth=1.3;
  E.forEach(([a,b],ei)=>{
    const A=N[a],B=N[b],mx=(A.x+B.x)/2,my=(A.y+B.y)/2,dx=B.x-A.x,dy=B.y-A.y,cx=mx-dy*0.08,cy=my+dx*0.08;
    const hot=hover!=null&&(a===hover||b===hover),dim=hover!=null&&!hot;
    ctx.strokeStyle=hot?"rgba(255,150,50,.95)":dim?"rgba(140,165,215,.13)":"rgba(155,185,240,.5)";
    ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.quadraticCurveTo(cx,cy,B.x,B.y);ctx.stroke();
    const u=((t*0.14)+(ei*0.618)%1)%1,iu=1-u;
    const px=iu*iu*A.x+2*iu*u*cx+u*u*B.x,py=iu*iu*A.y+2*iu*u*cy+u*u*B.y;
    ctx.beginPath();ctx.arc(px,py,hot?2.6:1.7,0,7);ctx.fillStyle=hot?"rgba(255,190,90,.95)":"rgba(170,205,255,.75)";
    ctx.shadowColor=hot?"#FF7A00":"#7fb2ff";ctx.shadowBlur=hot?10:6;ctx.fill();ctx.shadowBlur=0;
  });
  /* sphere nodes with glow + label pills */
  N.forEach((n,i)=>{
    const base=nodeColor(n.n),hub=n.n.hub||n.n.path==="00-Beranda.md";
    const breathe=hub?1+0.05*Math.sin(t*1.6+i):1,r=n.rad*breathe;
    const dim=hover!=null&&!nb.has(i);
    ctx.globalAlpha=dim?0.35:1;
    ctx.beginPath();ctx.arc(n.x,n.y,r*1.9,0,7);ctx.fillStyle=base+"2e";ctx.fill();
    ctx.shadowColor=base;ctx.shadowBlur=hover===i?26:hub?18:9;
    const g=ctx.createRadialGradient(n.x-r*0.38,n.y-r*0.42,r*0.15,n.x,n.y,r);
    g.addColorStop(0,"#ffffff");g.addColorStop(0.28,base);g.addColorStop(1,shade(base));
    ctx.beginPath();ctx.arc(n.x,n.y,r,0,7);ctx.fillStyle=g;ctx.fill();ctx.shadowBlur=0;
    if(hub){ctx.beginPath();ctx.arc(n.x,n.y,r+3.2,0,7);ctx.lineWidth=1.2;ctx.strokeStyle=base+"aa";ctx.stroke()}
    if(hover===i){ctx.beginPath();ctx.arc(n.x,n.y,r+6,0,7);ctx.lineWidth=1.6;ctx.strokeStyle="#fff";ctx.stroke()}
    const label=n.n.title.length>27?n.n.title.slice(0,26)+"…":n.n.title;
    ctx.font=`600 ${hub?12.5:11.5}px "Segoe UI",system-ui`;
    const w=ctx.measureText(label).width+14;
    ctx.beginPath();ctx.roundRect(n.x-w/2,n.y+r+6,w,17,8.5);
    ctx.fillStyle=hover===i?"rgba(255,122,0,.92)":"rgba(8,17,38,.78)";ctx.fill();
    ctx.fillStyle="#eef2fb";ctx.textAlign="center";ctx.fillText(label,n.x,n.y+r+18.5);
    ctx.globalAlpha=1;
  });
  ctx.restore();requestAnimationFrame(tick);
}
function shade(hex){const n=parseInt(hex.slice(1),16),r=(n>>16)*0.45|0,g=(n>>8&255)*0.45|0,b=(n&255)*0.45|0;return `rgb(${r},${g},${b})`}

function toWorld(e){const r=document.getElementById("cv").getBoundingClientRect();const px=(e.clientX-r.left)*devicePixelRatio,py=(e.clientY-r.top)*devicePixelRatio;return{x:(px-view.x)/view.k,y:(py-view.y)/view.k,px,py}}
function pick(w){let best=null,bd=1e9;G.N.forEach((n,i)=>{const d=(n.x-w.x)**2+(n.y-w.y)**2;if(d<bd){bd=d;best=i}});return bd< (G.N[best].rad+9)**2?best:null}
const cvEl=document.getElementById("cv");
cvEl.addEventListener("pointerdown",e=>{cvEl.setPointerCapture(e.pointerId);const w=toWorld(e);const i=pick(w);moved=false;
  if(i!=null){drag={n:G.N[i],i,dx:G.N[i].x-w.x,dy:G.N[i].y-w.y,wx:w.x,wy:w.y}}else{pan={sx:e.clientX,sy:e.clientY,vx:view.x,vy:view.y}}});
cvEl.addEventListener("pointermove",e=>{const w=toWorld(e);
  if(drag){drag.n.x=w.x+drag.dx;drag.n.y=w.y+drag.dy;drag.n.vx=0;drag.n.vy=0;if(Math.hypot(w.x-drag.wx,w.y-drag.wy)>4)moved=true}
  else if(pan){view.x=pan.vx+(e.clientX-pan.sx)*devicePixelRatio;view.y=pan.vy+(e.clientY-pan.sy)*devicePixelRatio;if(Math.abs(e.clientX-pan.sx)+Math.abs(e.clientY-pan.sy)>3)moved=true}
  else hover=pick(w);});
cvEl.addEventListener("pointerup",e=>{if(drag&&!moved){} if(drag&&moved===false){openNote(G.N[drag.i].n.path)} drag=null;pan=null;});
cvEl.addEventListener("wheel",e=>{e.preventDefault();const f=e.deltaY<0?1.12:0.89;view.k=Math.min(3.2,Math.max(0.25,view.k*f))},{passive:false});
cvEl.addEventListener("touchstart",e=>{if(e.touches.length===2){const[a,b]=e.touches;pinch={d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),k:view.k}}},{passive:true});
cvEl.addEventListener("touchmove",e=>{if(pinch&&e.touches.length===2){const[a,b]=e.touches;const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);view.k=Math.min(3.2,Math.max(0.25,pinch.k*d/pinch.d))}},{passive:true});
cvEl.addEventListener("touchend",()=>pinch=null);
document.getElementById("gz").onclick=()=>view.k=Math.min(3.2,view.k*1.25);
document.getElementById("gzo").onclick=()=>view.k=Math.max(0.25,view.k*0.8);
document.getElementById("gr").onclick=()=>{G=null;initGraph()};

(async()=>{const s=localStorage.getItem("sbw_key");if(s){try{const raw=Uint8Array.from(atob(s),c=>c.charCodeAt(0));show(await unlockWithKey(raw));}catch(e){localStorage.removeItem("sbw_key")}}})();
</script></body></html>
